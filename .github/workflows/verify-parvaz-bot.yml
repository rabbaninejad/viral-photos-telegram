name: Verify Parvaz95 bot token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Telegram bot identities without exposing tokens
        env:
          MAIN_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VIDEO_BOT_TOKEN: ${{ secrets.WOLF_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          for label, token in [("TELEGRAM_BOT_TOKEN", os.getenv("MAIN_BOT_TOKEN","")), ("WOLF_BOT_TOKEN", os.getenv("VIDEO_BOT_TOKEN",""))]:
              if not token:
                  print(f"{label}=MISSING")
                  continue
              try:
                  j=requests.get(f"https://api.telegram.org/bot{token}/getMe",timeout=20).json()
                  if j.get("ok"):
                      u=j["result"].get("username","")
                      print(f"{label}=@{u}")
                      print(f"{label}_MATCH={'YES' if u.lower()=='parvaz95_bot' else 'NO'}")
                  else:
                      print(f"{label}=INVALID")
              except Exception:
                  print(f"{label}=ERROR")
          PY