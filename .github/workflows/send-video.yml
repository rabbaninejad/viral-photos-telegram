name: Send viral video clip to Telegram

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  send-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python send_video.py
        env:
          WOLF_BOT_TOKEN: ${{ secrets.WOLF_BOT_TOKEN }}
          WOLF_CHAT_ID: ${{ secrets.WOLF_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      - name: Commit updated history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sent_video_ids.json
          git diff --cached --quiet || git commit -m "update sent video history"
          git push
